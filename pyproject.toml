[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "billweave"
version = "1.0.0"
description = "Local, auditable personal finance analyzer for Chinese payment platforms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.9",
    "jinja2>=3.1",
    "markdown>=3.5",
]

[project.scripts]
billweave = "billweave.cli:main"

[project.optional-dependencies]
sample = ["reportlab>=4.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
